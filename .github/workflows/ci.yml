# Throwaway CI probe (r25/ci-probe-*): the web unit suite at different browser concurrency.
name: CI

on:
  push:
    branches: ['r25/ci-probe-*']

permissions:
  contents: read

jobs:
  probe:
    name: Web unit (${{ matrix.workers }} workers, copy ${{ matrix.copy }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        workers: ['default', '2', '1']
        copy: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Machine
        run: nproc; free -m; node -e "console.log(require('os').availableParallelism())"
      - name: Web unit tests
        run: |
          if [ "${{ matrix.workers }}" != default ]; then export VITEST_MAX_WORKERS=${{ matrix.workers }}; fi
          start=$(date +%s)
          set +e
          pnpm --filter @pdf-editor/web test
          code=$?
          echo "PROBE-DURATION $(( $(date +%s) - start ))s exit=$code"
          exit $code
