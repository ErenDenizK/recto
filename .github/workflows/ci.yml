# CI probe (r25/ci-probe-penfade): the bar fade on Firefox, develop against develop without #76.
name: CI

on:
  push:
    branches: ['r25/ci-probe-penfade']

permissions:
  contents: read

jobs:
  probe:
    name: Probe (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        variant: [develop]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Revert #76
        if: matrix.variant == 'without-76'
        run: git revert -m 1 --no-commit 43c15b13eaec8d0a69f6c923b4370a7d1d80cf33
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          RECTO_RENDER_OVERRIDE: '1'
      - name: Probe
        if: false
        run: pnpm --filter @pdf-editor/web exec playwright test e2e/probe-penfade.spec.ts --project=firefox --workers=1 --retries=0 --repeat-each=2
        env:
          E2E_SKIP_BUILD: '1'
      - name: The failing test
        if: always()
        run: pnpm --filter @pdf-editor/web exec playwright test e2e/pen.spec.ts -g "a stroke under the bar draws" --project=firefox --workers=1 --retries=0 --repeat-each=12
        env:
          E2E_SKIP_BUILD: '1'
