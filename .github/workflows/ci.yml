# Throwaway CI probe (r25/ci-probe-*): WebKit eyedropper and capsule morph diagnostics only.
name: CI

on:
  push:
    branches: ['r25/ci-probe-*']

permissions:
  contents: read

jobs:
  probe:
    name: WebKit probe
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host --init
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @pdf-editor/web build
        env:
          RECTO_RENDER_OVERRIDE: '1'
      - name: Eyedropper
        if: always()
        run: >-
          pnpm --filter @pdf-editor/web exec playwright test e2e/eyedropper.spec.ts
          --project=webkit --repeat-each=6 --retries=0 --workers=1 --reporter=line
        env:
          E2E_SKIP_BUILD: '1'
      - name: Capsule
        if: always()
        run: >-
          pnpm --filter @pdf-editor/web exec playwright test e2e/capsule.spec.ts
          --project=webkit --repeat-each=3 --retries=0 --workers=1 --reporter=line
          -g "two contents at once, the row palette.+dock to palette$"
        env:
          E2E_SKIP_BUILD: '1'
