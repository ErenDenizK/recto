# Throwaway CI probe (r25/ci-probe-*): compact chrome spring on the phone project.
name: CI

on:
  push:
    branches: ['r25/ci-probe-*']

permissions:
  contents: read

jobs:
  probe:
    name: Phone probe
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host --init
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @pdf-editor/web build
        env:
          RECTO_RENDER_OVERRIDE: '1'
      - name: Compact spring
        run: >-
          pnpm --filter @pdf-editor/web exec playwright test e2e/compact.spec.ts
          --project=phone --repeat-each=8 --retries=0 --workers=1 --reporter=line
          -g "MOT-16"
        env:
          E2E_SKIP_BUILD: '1'
