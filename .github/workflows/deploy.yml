# Deploys the site to GitHub Pages (ADR-0004, ADR-0016): the app, its about page and the
# README and about-page media under media/ (docs/specs/presentation.md §2.6).
# Actions are pinned to major tags here; Renovate (helpers:pinGitHubActionDigests) rewrites
# them to commit digests with the tag kept as a comment.
#
# Branches: ADR-0017 §7 builds the public site from `main` only, which always holds the
# latest release. Until the first release (1.0.0-beta.0) creates `main`, the owner
# dispatches this workflow from `develop`. In the release commit, add
#   if: github.ref == 'refs/heads/main'
# to the `deploy` job so that a dispatch from any other branch is refused.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages:
    name: Pages artifact
    needs: [build, media]
    # Runs whether media succeeded, failed or timed out; only a failed build stops it.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only budgets.json, for the list of media files to carry over.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/media/budgets.json
          sparse-checkout-cone-mode: false

      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      # Served at <site>/media/<id>.gif; the README points at these URLs. Absent when the
      # media job failed or timed out; the next step then carries the published files over.
      - name: Download media
        id: media
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: media
          path: site/media

      # Fallback: copy every file in budgets.json from the live site, so the README and
      # about-page media keep working. Missing files are warned about, never fatal.
      - name: Carry over published media
        if: ${{ steps.media.outcome != 'success' }}
        env:
          LIVE_URL: ${{ vars.CUSTOM_DOMAIN && format('https://{0}', vars.CUSTOM_DOMAIN) || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          echo "::warning title=Media not refreshed::The media job failed or timed out, so this deploy carries the previously published media from $LIVE_URL/media/."
          mkdir -p site/media
          got=0
          for f in $(jq -r '.files | keys[]' tools/media/budgets.json); do
            if curl -fsSL --retry 3 --max-time 60 -o "site/media/$f" "$LIVE_URL/media/$f"; then
              got=$((got + 1))
            else
              rm -f "site/media/$f"
              echo "::warning title=Media file not carried over::$f is not on the live site."
            fi
          done
          echo "Carried over $got media files."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
