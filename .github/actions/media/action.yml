# Records the README and about-page media (docs/specs/presentation.md §2) and checks their
# budgets. Used by deploy.yml and release.yml after checkout, pnpm, Node and
# `pnpm install`. Leaves the publishable files (and requests.log) in tools/media/out/media/.
#
# Runs on a plain ubuntu-24.04 runner, not the Playwright container, whose ffmpeg is
# stripped (spec §2.6).
name: Record media
description: Build the app for the root path, record the media scenes, encode them with ffmpeg and check the budgets.

runs:
  using: composite
  steps:
    # Skips apt when the runner image already has what is needed, so a slow mirror cannot
    # stall the job; otherwise apt retries and times out per request, and `timeout` bounds
    # the whole step at 8 minutes (composite steps take no timeout-minutes).
    - name: Install Chromium and ffmpeg
      shell: bash
      run: |
        timeout 480 bash -euo pipefail <<'EOF'
        printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "20";' \
          'Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99recto-retries >/dev/null

        pnpm exec playwright install chromium

        missing=0
        checked=0
        for bin in "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux*/chrome \
          "$HOME"/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell; do
          [ -x "$bin" ] || continue
          checked=$((checked + 1))
          # Through a file: `ldd | grep -q` under pipefail reads SIGPIPE (141) as clean.
          ldd "$bin" > "$RUNNER_TEMP/ldd.txt" 2>&1 || true
          if grep -q 'not found' "$RUNNER_TEMP/ldd.txt"; then missing=1; fi
        done
        if [ "$checked" = 0 ]; then missing=1; fi
        # install-deps also brings the fonts the frames are rendered with.
        fc-list > "$RUNNER_TEMP/fc.txt" 2>/dev/null || true
        grep -qi 'noto color emoji' "$RUNNER_TEMP/fc.txt" || missing=1
        grep -qi liberation "$RUNNER_TEMP/fc.txt" || missing=1
        if [ "$missing" = 1 ]; then
          echo "Chromium system libraries missing; installing with apt"
          pnpm exec playwright install-deps chromium
        else
          echo "Chromium system libraries already present; skipping apt"
        fi

        if command -v ffmpeg >/dev/null; then
          echo "ffmpeg already installed: $(command -v ffmpeg)"
        else
          sudo apt-get install -y --no-install-recommends ffmpeg
        fi
        EOF

    # The media tool serves the build with `vite preview` at the server root
    # (tools/media/playwright.config.ts), so it records a build made for `/`. The Pages
    # build (base /<repository>/) cannot be served there; the pixels are the same.
    #
    # It compiles the test-only render override in (docs/specs/redesign.md X36), as CI's e2e
    # build does: the runner renders in software on four cores, where the app would start at
    # Glass Tinted and the cost ladder's step 2; the media show the real look, Clear and no
    # step (tools/media/lib/stage.ts). This build only feeds the scenes; the site and the
    # release's dist zip are built by their own jobs, without it.
    - name: Build for the root path
      shell: bash
      run: pnpm build
      env:
        VITE_BASE_PATH: /
        RECTO_RENDER_OVERRIDE: '1'

    - name: Record and encode
      shell: bash
      run: pnpm --filter @pdf-editor/media-tool all
      env:
        MEDIA_SKIP_BUILD: '1'

    # `all` ends with the same check; repeated here so the budget table is its own step.
    - name: Check budgets
      shell: bash
      run: pnpm --filter @pdf-editor/media-tool check
