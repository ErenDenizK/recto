<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    />
    <!-- Each scheme's canvas (ADR-0022 §2.4); theme.js below sets both to a chosen theme's. -->
    <meta name="theme-color" content="#08090c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e6e8eb" media="(prefers-color-scheme: light)" />
    <!-- The theme before the first paint (spec D3-7; src/state/theme.ts): a classic script, so
         it runs here, before the body; the CSP allows no inline one. -->
    <script src="%BASE_URL%theme.js"></script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Recto PDF" />
    <meta property="og:title" content="Recto" />
    <meta
      property="og:description"
      content="A PDF editor that runs entirely in your browser. Nothing is uploaded. Arrange pages across many PDFs, annotate, fill forms, redact, edit text, recognise scans, compare and sign."
    />
    <meta property="og:url" content="https://erendenizk.github.io/recto/" />
    <meta property="og:image" content="https://erendenizk.github.io/recto/media/social.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="Recto: a PDF editor that runs entirely in your browser. Nothing is uploaded."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="%BASE_URL%icons/glyph.svg" type="image/svg+xml" />
    <!-- The UI face's Latin file, fetched with the HTML so the first paint is already in it
         (ADR-0027 §2.1, quality-bar Q-8); styles/fonts.css declares it. -->
    <link
      rel="preload"
      href="%BASE_URL%fonts/inter-recto-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Recto</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
