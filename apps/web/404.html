<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#08090c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e6e8eb" media="(prefers-color-scheme: light)" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>Page not found · Recto</title>
    <style>
      /* The app's canvas, text and link underline in both schemes (tokens.css; ADR-0022 §2.4).
         The page stands alone, so the values are restated here, not imported. */
      :root {
        color-scheme: dark light;
        --canvas: #08090c;
        --text: #e8e9ec;
        --text-secondary: #a1a5ab;
        --link-line: rgb(200 251 61 / 0.5);
        --link-hover: #c8fb3d;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --canvas: #e6e8eb;
          --text: #15171c;
          --text-secondary: #4f535a;
          --link-line: #446713;
          --link-hover: #15171c;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--canvas);
        color: var(--text);
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 600;
        line-height: 1.2;
      }
      p {
        color: var(--text-secondary);
      }
      a {
        color: var(--text);
        text-decoration-color: var(--link-line);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }
      a:hover {
        text-decoration-color: var(--link-hover);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>This address does not exist. The editor lives at a single page.</p>
      <p><a href="%BASE_URL%">Open Recto</a></p>
    </main>
  </body>
</html>
