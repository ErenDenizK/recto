<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "/etc/fonts/conf.d/fonts.dtd">
<!--
  Recto's font substitution table for the Office conversion package (PRD-20, r2). It replaces
  /instdir/share/fonts/truetype/fc_local.conf inside soffice.data (packages/engine/office/fetch.ts).
  Every substitute named here is a font that stays in the package. "prefer" lists the face used
  when the document's own font is absent. Metric-compatible pairs keep line breaks and page
  counts; the others are the closest shipped face and may reflow.
-->
<fontconfig>
<match target="pattern">
  <test name="family"><string>Symbol</string></test>
  <edit name="family" mode="append" binding="same">
    <string>OpenSymbol</string>
  </edit>
</match>

	<!-- Metric-compatible: -->

	<alias binding="same">
	  <family>Calibri</family>
	  <accept>
	  <family>Carlito</family>
	  </accept>
	</alias>

	<!-- Calibri Light has no free twin; Carlito Regular keeps the widths close, not the weight. -->
	<alias binding="same">
	  <family>Calibri Light</family>
	  <prefer>
	  <family>Carlito</family>
	  </prefer>
	</alias>

	<alias binding="same">
	  <family>Cambria</family>
	  <accept>
	  <family>Caladea</family>
	  </accept>
	</alias>

	<alias binding="same">
	  <family>Arial</family>
	  <prefer>
	  <family>Liberation Sans</family>
	  </prefer>
	</alias>

	<alias binding="same">
	  <family>Times New Roman</family>
	  <prefer>
	  <family>Liberation Serif</family>
	  </prefer>
	</alias>

	<alias binding="same">
	  <family>Courier New</family>
	  <prefer>
	  <family>Liberation Mono</family>
	  </prefer>
	</alias>

	<!-- Liberation Sans Narrow is not shipped (GPL, BQ-1): Arial Narrow text is wider and may
	     gain a page. -->
	<alias binding="same">
	  <family>Arial Narrow</family>
	  <prefer>
	  <family>Liberation Sans</family>
	  </prefer>
	</alias>

	<!-- Aptos has no metric-compatible free font. Left as Carlito until the fidelity fixtures
	     (Lane E) decide between Carlito and Liberation Sans; the choice is a one-line change. -->
	<alias binding="same">
	  <family>Aptos</family>
	  <prefer>
	  <family>Carlito</family>
	  </prefer>
	</alias>

	<alias binding="same">
	  <family>Aptos Display</family>
	  <prefer>
	  <family>Carlito</family>
	  </prefer>
	</alias>

	<alias binding="same">
	  <family>Aptos Narrow</family>
	  <prefer>
	  <family>Carlito</family>
	  </prefer>
	</alias>

	<!-- Not metric-compatible; the closest faces shipped (no new fonts, BQ-3): -->

	<alias binding="same">
	  <family>Segoe UI</family>
	  <prefer>
	  <family>Noto Sans</family>
	  </prefer>
	</alias>

	<alias binding="same">
	  <family>Verdana</family>
	  <prefer>
	  <family>DejaVu Sans</family>
	  </prefer>
	</alias>

	<alias binding="same">
	  <family>Tahoma</family>
	  <prefer>
	  <family>DejaVu Sans Condensed</family>
	  </prefer>
	</alias>

	<alias binding="same">
	  <family>Georgia</family>
	  <prefer>
	  <family>Noto Serif</family>
	  </prefer>
	</alias>

	<alias binding="same">
	  <family>Garamond</family>
	  <prefer>
	  <family>Noto Serif</family>
	  </prefer>
	</alias>

	<alias binding="same">
	  <family>Century Gothic</family>
	  <prefer>
	  <family>DejaVu Sans</family>
	  </prefer>
	</alias>

	<!-- Faces dropped from the package (size): the nearest shipped family. -->
	<alias binding="same">
	  <family>Linux Libertine G</family>
	  <prefer>
	  <family>Liberation Serif</family>
	  </prefer>
	</alias>

	<alias binding="same">
	  <family>Linux Biolinum G</family>
	  <prefer>
	  <family>Liberation Sans</family>
	  </prefer>
	</alias>

	<alias binding="same">
	  <family>Gentium Basic</family>
	  <prefer>
	  <family>Noto Serif</family>
	  </prefer>
	</alias>

	<alias binding="same">
	  <family>Gentium Book Basic</family>
	  <prefer>
	  <family>Noto Serif</family>
	  </prefer>
	</alias>

	<!-- Hebrew: the OFL successors of the Culmus faces (David Libre, Miriam Libre and Frank Ruhl
	     Hofshi are in the package; Culmus itself is not). -->
	<alias binding="same">
	  <family>David</family>
	  <prefer>
	  <family>David Libre</family>
	  </prefer>
	</alias>

	<alias binding="same">
	  <family>Miriam</family>
	  <prefer>
	  <family>Miriam Libre</family>
	  </prefer>
	</alias>

	<alias binding="same">
	  <family>FrankRuehl</family>
	  <prefer>
	  <family>Frank Ruhl Hofshi</family>
	  </prefer>
	</alias>
</fontconfig>
